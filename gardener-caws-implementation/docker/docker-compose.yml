services:

  ## Application service
  # PostgreSQL and RabbitMQ are shared with the carp-webservices stack, which must be running first.
  carp-wearables-service:
    container_name: carp-wearables-service-${PROFILE:-local}
    build:
      context: ../..
      dockerfile: gardener-caws-implementation/docker/Dockerfile
    env_file:
      - path: ../.env
        required: false
    ports:
      - 8444:8444
    expose:
      - 8444
    environment:
      - profile=${PROFILE:-local}
      # Gardener keeps its tables in its own schema and creates its exchange/queue if they are missing.
      - POSTGRES__JDBC_URL=jdbc:postgresql://carp-postgres-${PROFILE:-local}:5432/${POSTGRES_DB:-gardener}
      - POSTGRES__USERNAME=${POSTGRES_USER:-admin}
      - POSTGRES__PASSWORD=${POSTGRES_PASSWORD:-admin}
      - RABBITMQ__HOST=carp-rabbitmq-${PROFILE:-local}
      - RABBITMQ__PORT=5672
      - RABBITMQ__USERNAME=${RABBITMQ_USER:-admin}
      - RABBITMQ__PASSWORD=${RABBITMQ_PASSWORD:-admin}
    networks:
      - carp
    # The shared services live in another Compose project, so startup order can't be enforced; retry instead.
    restart: unless-stopped

networks:
  # Created by the carp-webservices stack.
  carp:
    external: true
    name: carp-${PROFILE:-local}
