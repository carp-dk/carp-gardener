services:

  ## Application service
  carp-wearables-service:
    container_name: carp-wearables-service-${PROFILE:-local}
    build:
      context: ../..
      dockerfile: gardener-caws-implementation/docker/Dockerfile
    env_file:
      - path: ../.env
        required: false
    ports:
      - 8444:8444
    expose:
      - 8444
    environment:
      - profile=${PROFILE:-local}
      - RABBITMQ__HOST=rabbitmq-common
      - RABBITMQ__PORT=5672
      - POSTGRES__JDBC_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gardener}
      - POSTGRES__USERNAME=${POSTGRES_USER:-admin}
      - POSTGRES__PASSWORD=${POSTGRES_PASSWORD:-admin}
    networks:
      - cans
    depends_on:
      rabbitmq-common:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Common RabbitMQ
  rabbitmq-common:
    container_name: carp-rabbitmq-${PROFILE:-local}
    hostname: rabbitmq-common
    image: rabbitmq:4-management
    ports:
      - 5673:5672
      - 15673:15672
      - 15693:15692
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/data
      - ./config/rabbit/definitions.json:/etc/rabbitmq/definitions.json
      - ./config/rabbit/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - ./config/rabbit/enabled_plugins:/etc/rabbitmq/enabled_plugins
    networks:
      - cans
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  # PostgreSQL
  postgres:
    container_name: carp-postgres-${PROFILE:-local}
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gardener}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cans
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

networks:
  cans:
    driver: bridge

volumes:
  postgres_data:
    name: carp_postgres_data_${PROFILE:-local}
  rabbitmq_data:
    name: carp_rabbitmq_data_${PROFILE:-local}
