services:

  ## Application service
  # PostgreSQL and RabbitMQ are shared with the carp-webservices stack, which must be running first.
  carp-wearables-service:
    container_name: carp-wearables-service-${PROFILE:-local}
    # Servers pull the image CI pushed for their profile (see deployment.sh); `up --build` builds it locally instead.
    image: registry.carp.dk/carp/carp-gardener:${PROFILE:-local}
    build:
      context: ../..
      dockerfile: gardener-caws-implementation/docker/Dockerfile
    env_file:
      - path: ../.env
        required: false
    ports:
      - 8444:8444
    expose:
      - 8444
    environment:
      # PROFILE is the carp-webservices stack profile (local, development, production, ...); CONFIG_PROFILE picks
      # Gardener's conf/config-<profile>.json (local, prod).
      - profile=${CONFIG_PROFILE:-local}
      # Gardener keeps its tables in its own schema and creates its exchange/queue if they are missing.
      # Like carp-webservices, one ADMIN_USER / ADMIN_PASSWORD pair is used for PostgreSQL and RabbitMQ.
      - POSTGRES__JDBC_URL=jdbc:postgresql://carp-postgres-${PROFILE:-local}:5432/${POSTGRES_DB:-gardener}
      - POSTGRES__USERNAME=${ADMIN_USER:-admin}
      - POSTGRES__PASSWORD=${ADMIN_PASSWORD:-admin}
      - RABBITMQ__HOST=carp-rabbitmq-${PROFILE:-local}
      - RABBITMQ__PORT=5672
      - RABBITMQ__USERNAME=${ADMIN_USER:-admin}
      - RABBITMQ__PASSWORD=${ADMIN_PASSWORD:-admin}
      - RABBITMQ__EXCHANGE__NAME=third-party-direct-exchange-${PROFILE:-local}
      - RABBITMQ__QUEUE__NAME=third-party-queue-${PROFILE:-local}
    networks:
      - carp
    # The shared services live in another Compose project, so startup order can't be enforced; retry instead.
    restart: unless-stopped

networks:
  # Created by the carp-webservices stack.
  carp:
    external: true
    name: carp-${PROFILE:-local}
