name: create docker image

# Each branch publishes the image tag its servers deploy: develop -> development, main -> production.
# The tag matches the server's PROFILE in gardener-caws-implementation/.env.
on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  IMAGE: registry.carp.dk/carp/carp-gardener

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get tag
        id: tag
        run: |
          case "${GITHUB_REF_NAME}" in
            develop) echo "TAG=development" >> "$GITHUB_OUTPUT" ;;
            main)    echo "TAG=production" >> "$GITHUB_OUTPUT" ;;
            *)       echo "No image tag for branch ${GITHUB_REF_NAME}" >&2; exit 1 ;;
          esac

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: registry.carp.dk
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The commit tag keeps every build addressable for rollbacks.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gardener-caws-implementation/docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.TAG }}
            ${{ env.IMAGE }}:${{ steps.tag.outputs.TAG }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
