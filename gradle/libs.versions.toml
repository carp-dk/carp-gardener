[versions]
kotlin = "2.4.21"
junit = "6.1.3"
shadow = "9.6.1"
slf4j = "2.0.20"
logback = "1.6.6"
jackson = "2.22.4"
mockitoKotlin = "6.4.0"
detekt = "1.23.8"
ktlintGradle = "14.2.0"

ktor = "3.6.1"

postgresql = "42.7.14"
hikari = "7.1.0"


# Coroutines
kotlinx_coroutines = "1.11.0"
# Aligns the Netty modules pulled in by Ktor and the RabbitMQ client on one version.
netty = "4.2.20.Final"
kotlinx_serialization_json = "1.12.0"
carp = "1.3.0"

[libraries]
guava = { module = "com.google.guava:guava", version = "33.8.0-jre" }
scribejava = { module = "com.github.scribejava:scribejava-core", version = "8.3.3" }

jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jackson-jsr310        = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }

slf4j-api    = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback      = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

rabbitmq     = { module = "com.rabbitmq:amqp-client", version = "5.37.0" }
netty-bom    = { module = "io.netty:netty-bom", version.ref = "netty" }

kotlin-stdlib  = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

mockito-kotlin        = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockitoKotlin" }

# Ktor
ktor-server-core = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty-jvm", version.ref = "ktor" }
ktor-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation-jvm", version.ref = "ktor" }
ktor-serialization-jackson = { module = "io.ktor:ktor-serialization-jackson-jvm", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core-jvm", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio-jvm", version.ref = "ktor" }

detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx_coroutines" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx_serialization_json" }
carp-data-core = { module = "dk.cachet.carp.data:carp.data.core-jvm", version.ref = "carp" }
carp-common = { module = "dk.cachet.carp.common:carp.common-jvm", version.ref = "carp" }


[plugins]
kotlin-jvm            = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization  = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow                = { id = "com.gradleup.shadow", version.ref = "shadow" }
application           = { id = "application" }  # core plugin, no version

detekt                = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint                = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
